<!DOCTYPE html>
<html lang="es" data-theme="dark" data-bubble="rounded" data-font="inter">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zel AI</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES GLOBALES Y TEMAS --- */
        :root {
            --accent: #10a37f;
            --accent-hover: color-mix(in srgb, var(--accent) 80%, black);
            --accent-transparent: color-mix(in srgb, var(--accent) 15%, transparent);
            --font-size-base: 15px;
            --radius-bubble: 16px;
        }

        :root[data-theme="dark"] {
            --bg-color: #0b0c10; --sidebar-bg: #14161c; --chat-bg: #14161c; --header-bg: #0b0c10;
            --text-main: #e2e8f0; --text-muted: #8b949e; --user-msg: #1f2937; --user-msg-text: #f8fafc;
            --ai-msg: transparent; --ai-msg-text: #e2e8f0; --border: #2d3748; --code-bg: #0d1117;
        }

        :root[data-theme="light"] {
            --bg-color: #f3f4f6; --sidebar-bg: #ffffff; --chat-bg: #ffffff; --header-bg: #f3f4f6;
            --text-main: #1f2937; --text-muted: #6b7280; --user-msg: var(--accent-transparent); --user-msg-text: #111827;
            --ai-msg: transparent; --ai-msg-text: #1f2937; --border: #e5e7eb; --code-bg: #f8fafc;
        }
        
        :root[data-theme="glass"] {
            --bg-color: #0f172a; --sidebar-bg: rgba(30, 41, 59, 0.75); --chat-bg: transparent; --header-bg: rgba(15, 23, 42, 0.85);
            --text-main: #f1f5f9; --text-muted: #94a3b8; --user-msg: rgba(51, 65, 85, 0.8); --user-msg-text: #ffffff;
            --ai-msg: transparent; --ai-msg-text: #f1f5f9; --border: rgba(255, 255, 255, 0.1); --code-bg: rgba(0, 0, 0, 0.5);
        }

        /* Tipografía y Burbujas */
        :root[data-font="inter"] { --font-family: 'Inter', sans-serif; }
        :root[data-font="roboto"] { --font-family: 'Roboto', sans-serif; }
        :root[data-font="mono"] { --font-family: 'Fira Code', monospace; }
        :root[data-bubble="rounded"] { --radius-bubble: 20px; }
        :root[data-bubble="square"] { --radius-bubble: 4px; }
        :root[data-bubble="minimal"] { --radius-bubble: 0px; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; height: 100vh; overflow: hidden; font-size: var(--font-size-base);
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- HEADER --- */
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background-color: var(--header-bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-toggle { background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; display: none; padding: 4px; }
        .header-brand { display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 18px; font-weight: 700; }
        .header-logo { height: 28px; width: 28px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; }
        
        .header-stats { display: flex; gap: 10px; font-size: 11px; color: var(--text-muted); background: var(--sidebar-bg); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); }
        .header-actions { display: flex; gap: 6px; }
        .header-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; padding: 6px; border-radius: 6px; transition: 0.2s; }
        .header-actions button:hover { color: var(--accent); background-color: var(--accent-transparent); }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; position: fixed; top: 60px; bottom: 0; left: 0; z-index: 90;
            transition: transform 0.3s ease; backdrop-filter: blur(10px);
        }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 12px 0; font-weight: 600; cursor: pointer; transition: 0.2s; border-bottom: 2px solid transparent; font-size: 11px; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content { display: none; padding: 15px; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; }
        .tab-content.active { display: flex; }

        .new-chat-btn {
            width: 100%; padding: 10px; background-color: var(--accent); color: white;
            border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; font-size: 13px;
        }
        .new-chat-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-transparent); }

        .search-box { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-main); font-size: 12px; outline: none; }
        .search-box:focus { border-color: var(--accent); }

        .chats-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .saved-chat {
            padding: 10px; border-radius: 8px; cursor: pointer; color: var(--text-main);
            transition: 0.2s; display: flex; flex-direction: column; gap: 4px; border: 1px solid transparent; font-size: 13px; position: relative;
        }
        .saved-chat:hover { background-color: var(--bg-color); }
        .saved-chat.active { background-color: var(--accent-transparent); border-color: var(--accent); }
        .chat-header-row { display: flex; align-items: center; justify-content: space-width; width: 100%; }
        .chat-title { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-summary { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
        
        .chat-actions { display: none; gap: 4px; position: absolute; right: 8px; top: 10px; background: var(--sidebar-bg); padding: 2px; border-radius: 4px; }
        .saved-chat:hover .chat-actions { display: flex; }
        .chat-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 4px; transition: 0.2s; }
        .chat-actions button:hover { color: var(--accent); }
        .chat-actions button.pinned { color: var(--accent); }

        /* Controles de Configuración */
        .config-group { display: flex; flex-direction: column; gap: 4px; }
        .config-group label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .config-group select, .config-group input[type="color"] {
            width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
            background-color: var(--bg-color); color: var(--text-main); font-size: 12px; outline: none;
        }
        .config-group textarea {
            width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
            background-color: var(--bg-color); color: var(--text-main); font-size: 12px; resize: vertical; min-height: 60px; outline: none;
        }
        .section-title { font-size: 11px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 6px; text-transform: uppercase; font-weight: bold; }

        /* --- CHAT AREA --- */
        .main-chat {
            flex: 1; display: flex; flex-direction: column; margin-left: 300px; padding-top: 60px;
            background-color: var(--chat-bg); position: relative; height: 100vh;
        }

        .chat-history { flex: 1; padding: 20px 15%; overflow-y: auto; scroll-behavior: smooth; display: flex; flex-direction: column; gap: 20px; }
        
        .message-container { display: flex; gap: 12px; animation: fadeIn 0.3s ease; position: relative; max-width: 100%; }
        .message-container.user { justify-content: flex-end; }
        
        .message-avatar {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            background-color: var(--accent); color: white; font-size: 14px; overflow: hidden; border: 2px solid var(--chat-bg);
        }
        .message-container.user .message-avatar { background-color: var(--user-msg); border-color: var(--border); order: 2; }

        .message-bubble {
            padding: 14px 18px; border-radius: var(--radius-bubble); position: relative;
            background-color: var(--ai-msg); color: var(--ai-msg-text); max-width: 85%; word-break: break-word;
        }
        .message-container.user .message-bubble {
            background-color: var(--user-msg); color: var(--user-msg-text);
            border-bottom-right-radius: 4px; border: 1px solid var(--border); order: 1;
        }
        .message-container.assistant .message-bubble { border-bottom-left-radius: 4px; }

        /* Toolbar del mensaje */
        .msg-toolbar {
            position: absolute; bottom: -25px; opacity: 0; transition: opacity 0.2s;
            display: flex; gap: 4px; background-color: var(--sidebar-bg); padding: 2px 6px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .message-container:hover .msg-toolbar { opacity: 1; }
        .message-container.user .msg-toolbar { right: 40px; }
        .message-container.assistant .msg-toolbar { left: 40px; }
        .msg-toolbar button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 12px; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .msg-toolbar button:hover { background-color: var(--border); color: var(--accent); }
        .msg-toolbar button.active-tts { color: #ef4444; background-color: rgba(239, 68, 68, 0.1); }

        /* Markdown Styles */
        .message-bubble pre { background-color: var(--code-bg) !important; padding: 12px; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; margin: 10px 0; position: relative; }
        .code-copy-btn {
            position: absolute; top: 6px; right: 6px; background: var(--border); color: var(--text-main);
            border: none; padding: 3px 6px; font-size: 10px; border-radius: 4px; cursor: pointer; opacity: 0.7; transition: 0.2s;
        }
        .code-copy-btn:hover { opacity: 1; background: var(--accent); color: white; }
        .message-bubble code { font-family: 'Fira Code', monospace; font-size: 0.85em; padding: 2px 4px; border-radius: 4px; background-color: var(--code-bg); }
        .message-bubble pre code { padding: 0; background-color: transparent; }
        .message-bubble p { margin-bottom: 10px; line-height: 1.6; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble a { color: var(--accent); text-decoration: none; }

        /* --- INPUT AREA --- */
        .input-wrapper { padding: 15px 15%; background: linear-gradient(180deg, transparent, var(--bg-color) 30%); }
        
        .stop-btn-container { text-align: center; margin-bottom: 8px; display: none; }
        .stop-btn { background-color: var(--sidebar-bg); border: 1px solid var(--border); color: var(--text-main); padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .stop-btn:hover { border-color: #ef4444; color: #ef4444; }

        .input-box {
            display: flex; gap: 8px; align-items: flex-end; background-color: var(--sidebar-bg);
            border: 1px solid var(--border); border-radius: 18px; padding: 8px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; position: relative;
        }
        .input-box:focus-within { border-color: var(--accent); box-shadow: 0 4px 15px var(--accent-transparent); }

        .mic-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 8px;
            border-radius: 50%; font-size: 16px; transition: 0.2s; flex-shrink: 0;
        }
        .mic-btn:hover { color: var(--accent); background-color: var(--accent-transparent); }
        .mic-btn.recording { color: #ef4444; animation: pulse 1.5s infinite; background-color: rgba(239, 68, 68, 0.1); }

        textarea {
            flex: 1; background: transparent; color: var(--text-main); border: none; font-size: 14px;
            resize: none; max-height: 200px; height: 22px; outline: none; padding: 8px 0; line-height: 1.4;
        }

        .send-btn {
            background-color: var(--accent); color: white; border: none; border-radius: 50%;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; flex-shrink: 0; margin-bottom: 2px;
        }
        .send-btn:hover:not(:disabled) { background-color: var(--accent-hover); transform: scale(1.05); }
        .send-btn:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; }

        /* Animations */
        .typing-indicator { display: none; align-items: center; gap: 4px; padding: 8px 15px; color: var(--accent); font-size: 12px; font-weight: bold; }
        .typing-indicator span { width: 4px; height: 4px; background-color: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* --- MEDIA QUERIES PARA MÓVILES --- */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; z-index: 105; }
            .sidebar.mobile-open { transform: translateX(0); }
            .main-chat { margin-left: 0; }
            .menu-toggle { display: block; }
            .chat-history { padding: 15px 5%; }
            .input-wrapper { padding: 10px 5%; }
            .header-stats { display: none; }
        }

        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <div class="header-brand">
                <div class="header-logo">Z</div>
                Zel AI
            </div>
        </div>
        <div class="header-stats">
            <span id="msgCount">Mensajes: 0</span> | <span id="tokenCount">Tokens: ~0</span>
        </div>
        <div class="header-actions">
            <button id="summarizeBtn" title="Resumen Ejecutivo IA"><i class="fas fa-file-invoice"></i></button>
            <button id="downloadBtn" title="Exportar TXT"><i class="fas fa-file-export"></i></button>
            <button id="deleteBtn" title="Borrar Hilo Actual"><i class="fas fa-trash"></i></button>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="tabs">
            <button class="tab-btn active" data-target="tab-chats"><i class="fas fa-comments"></i> Chats</button>
            <button class="tab-btn" data-target="tab-config"><i class="fas fa-sliders-h"></i> UI</button>
            <button class="tab-btn" data-target="tab-persona"><i class="fas fa-brain"></i> IA</button>
        </div>

        <!-- Pestaña Chats con Buscador y Guardado Inteligente -->
        <div class="tab-content active" id="tab-chats">
            <button class="new-chat-btn" id="newChatBtn"><i class="fas fa-plus"></i> Nueva Conversación</button>
            <input type="text" class="search-box" id="searchChats" placeholder="Buscar en el historial...">
            <div class="chats-list" id="savedChatsList"></div>
        </div>

        <!-- Pestaña Configuración Visual -->
        <div class="tab-content" id="tab-config">
            <div class="section-title">Apariencia</div>
            <div class="config-group">
                <label>Tema</label>
                <select id="themeSelect">
                    <option value="dark">Oscuro Profesional</option>
                    <option value="light">Claro Limpio</option>
                    <option value="glass">Cristal (Glassmorphism)</option>
                </select>
            </div>
            <div class="config-group">
                <label>Énfasis</label>
                <input type="color" id="accentColorPicker" value="#10a37f">
            </div>
            <div class="config-group">
                <label>Tipografía</label>
                <select id="fontSelect">
                    <option value="inter">Inter</option>
                    <option value="roboto">Roboto</option>
                    <option value="mono">Fira Code</option>
                </select>
            </div>
            <div class="config-group">
                <label>Burbujas</label>
                <select id="bubbleSelect">
                    <option value="rounded">Redondeadas</option>
                    <option value="square">Cuadradas</option>
                    <option value="minimal">Minimalistas</option>
                </select>
            </div>
        </div>

        <!-- Pestaña IA -->
        <div class="tab-content" id="tab-persona">
            <div class="section-title">Modelo & Rol</div>
            <div class="config-group">
                <label>Modelo IA</label>
                <select id="modelSelect">
                    <option value="openrouter/free">Ruteo Automático Gratuito</option>
                    <option value="meta-llama/llama-3-8b-instruct:free">Llama 3 8B (Meta)</option>
                    <option value="mistralai/mistral-7b-instruct:free">Mistral 7B Instruct</option>
                    <option value="google/gemma-7b-it:free">Gemma 7B (Google)</option>
                </select>
            </div>
            <div class="config-group">
                <label>Rol del Asistente</label>
                <select id="roleSelect">
                    <option value="asistente">Asistente General</option>
                    <option value="programador">Ingeniero de Software</option>
                    <option value="traductor">Traductor Experto</option>
                    <option value="ciberseguridad">Ciberseguridad</option>
                    <option value="terapeuta">Terapeuta Empático</option>
                </select>
            </div>
            <div class="config-group">
                <label>Tono</label>
                <select id="toneSelect">
                    <option value="profesional">Profesional y Directo</option>
                    <option value="amigable">Amigable y Cercano</option>
                    <option value="sarcástico">Sarcástico y Divertido</option>
                </select>
            </div>
            <div class="config-group">
                <label>Prompt Personalizado</label>
                <textarea id="customPrompt" placeholder="Instrucciones adicionales..."></textarea>
            </div>
            <button class="new-chat-btn" style="background:var(--border); color:var(--text-main);" onclick="applyPersonality()">Aplicar al Chat</button>
        </div>
    </div>

    <div class="main-chat" id="mainChat">
        <div class="chat-history" id="chatHistory"></div>
        
        <div class="typing-indicator" id="typingIndicator">
            Zel escribiendo <span></span><span></span><span></span>
        </div>

        <div class="input-wrapper">
            <div class="stop-btn-container" id="stopBtnContainer">
                <button class="stop-btn" id="stopBtn"><i class="fas fa-stop"></i> Interrumpir</button>
            </div>
            <div class="input-box">
                <button class="mic-btn" id="micBtn" title="Dictado por voz"><i class="fas fa-microphone"></i></button>
                <textarea id="userInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================
           NÚCLEO: API KEY FIJA NATIVA (INMUTABLE)
           ========================================== */
        const API_KEY = "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";

        const generateSystemPrompt = () => {
            const role = DOM.roleSelect.value;
            const tone = DOM.toneSelect.value;
            const custom = DOM.customPrompt.value.trim();
            
            let base = `Eres Zel AI, un sistema inteligente avanzado y profesional. `;
            const roles = {
                asistente: "Actúas como un asistente versátil.",
                programador: "Actúas como un Ingeniero de Software Senior.",
                traductor: "Actúas como un traductor experto.",
                ciberseguridad: "Actúas como un experto en ciberseguridad.",
                terapeuta: "Actúas como un oyente empático."
            };
            base += roles[role] + " ";
            base += `Tu tono debe ser ${tone}. Usa emojis moderadamente. `;
            if(custom) base += `\nINSTRUCCIONES: ${custom}`;
            return base;
        };

        let chats = JSON.parse(localStorage.getItem('zel_pro_chats') || '{}');
        let currentChatId = null;
        let abortController = null;
        let ttsSpeaking = false;

        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            const validLang = hljs.getLanguage(language) ? language : 'plaintext';
            const highlighted = hljs.highlight(code, { language: validLang }).value;
            const codeId = 'code_' + Math.random().toString(36).substr(2, 9);
            return `<pre><button class="code-copy-btn" onclick="copyCodeSnippet('${codeId}')">Copiar</button><code id="${codeId}" class="hljs ${validLang}">${code}</code></pre>`;
        };
        marked.setOptions({ renderer, breaks: true, gfm: true });

        const DOM = {
            chatHistory: document.getElementById('chatHistory'), userInput: document.getElementById('userInput'),
            sendBtn: document.getElementById('sendBtn'), micBtn: document.getElementById('micBtn'),
            typingIndicator: document.getElementById('typingIndicator'), savedChatsList: document.getElementById('savedChatsList'),
            stopBtnContainer: document.getElementById('stopBtnContainer'), stopBtn: document.getElementById('stopBtn'),
            msgCount: document.getElementById('msgCount'), tokenCount: document.getElementById('tokenCount'),
            themeSelect: document.getElementById('themeSelect'), accentPicker: document.getElementById('accentColorPicker'),
            fontSelect: document.getElementById('fontSelect'), bubbleSelect: document.getElementById('bubbleSelect'),
            roleSelect: document.getElementById('roleSelect'), toneSelect: document.getElementById('toneSelect'),
            modelSelect: document.getElementById('modelSelect'), customPrompt: document.getElementById('customPrompt'),
            sidebar: document.getElementById('sidebar'), menuToggle: document.getElementById('menuToggle'),
            searchChats: document.getElementById('searchChats')
        };

        /* Control UI Móvil */
        DOM.menuToggle.addEventListener('click', () => DOM.sidebar.classList.toggle('mobile-open'));
        document.addEventListener('click', (e) => {
            if(window.innerWidth <= 768 && !DOM.sidebar.contains(e.target) && !DOM.menuToggle.contains(e.target)) {
                DOM.sidebar.classList.remove('mobile-open');
            }
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                e.currentTarget.classList.add('active');
                document.getElementById(e.currentTarget.dataset.target).classList.add('active');
            });
        });

        const savePrefs = (key, val) => localStorage.setItem(`zel_pref_pro_${key}`, val);
        const loadPrefs = () => {
            const apply = (key, el, action) => {
                const val = localStorage.getItem(`zel_pref_pro_${key}`);
                if(val) { el.value = val; action(val); }
            };
            apply('theme', DOM.themeSelect, v => document.documentElement.setAttribute('data-theme', v));
            apply('font', DOM.fontSelect, v => document.documentElement.setAttribute('data-font', v));
            apply('bubble', DOM.bubbleSelect, v => document.documentElement.setAttribute('data-bubble', v));
            apply('accent', DOM.accentPicker, v => document.documentElement.style.setProperty('--accent', v));
            apply('model', DOM.modelSelect, () => {}); apply('role', DOM.roleSelect, () => {});
            apply('tone', DOM.toneSelect, () => {}); apply('custom', DOM.customPrompt, () => {});
        };

        DOM.themeSelect.addEventListener('change', e => { document.documentElement.setAttribute('data-theme', e.target.value); savePrefs('theme', e.target.value); });
        DOM.fontSelect.addEventListener('change', e => { document.documentElement.setAttribute('data-font', e.target.value); savePrefs('font', e.target.value); });
        DOM.bubbleSelect.addEventListener('change', e => { document.documentElement.setAttribute('data-bubble', e.target.value); savePrefs('bubble', e.target.value); });
        DOM.accentPicker.addEventListener('input', e => { document.documentElement.style.setProperty('--accent', e.target.value); savePrefs('accent', e.target.value); });
        DOM.modelSelect.addEventListener('change', e => savePrefs('model', e.target.value));
        DOM.roleSelect.addEventListener('change', e => savePrefs('role', e.target.value));
        DOM.toneSelect.addEventListener('change', e => savePrefs('tone', e.target.value));
        DOM.customPrompt.addEventListener('input', e => savePrefs('custom', e.target.value));

        window.applyPersonality = () => {
            if(!currentChatId) return;
            chats[currentChatId].history[0].content = generateSystemPrompt();
            saveLocal(); alert("Configuración aplicada a este chat.");
        };

        DOM.userInput.addEventListener('input', function() {
            this.style.height = '22px'; this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            DOM.sendBtn.disabled = this.value.trim().length === 0;
        });

        DOM.userInput.addEventListener('keydown', e => {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if(!DOM.sendBtn.disabled) handleSend(); }
        });

        /* --- FUNCIONES DE HISTORIAL INTELIGENTE --- */
        const saveLocal = () => localStorage.setItem('zel_pro_chats', JSON.stringify(chats));
        
        const updateStats = () => {
            if(!chats[currentChatId]) return;
            const msgs = chats[currentChatId].history.filter(m => m.role !== 'system');
            DOM.msgCount.textContent = `Mensajes: ${msgs.length}`;
            let chars = msgs.reduce((acc, m) => acc + m.content.length, 0);
            DOM.tokenCount.textContent = `Tokens: ~${Math.round(chars/4)}`;
        };

        const renderChatList = (filter = "") => {
            DOM.savedChatsList.innerHTML = '';
            const sortedChats = Object.values(chats).sort((a,b) => {
                if(a.pinned && !b.pinned) return -1;
                if(!a.pinned && b.pinned) return 1;
                return b.updated - a.updated;
            });

            sortedChats.forEach(chat => {
                if(filter && !chat.title.toLowerCase().includes(filter.toLowerCase()) && !chat.summary.toLowerCase().includes(filter.toLowerCase())) return;
                
                const div = document.createElement('div');
                div.className = `saved-chat ${chat.id === currentChatId ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="chat-header-row">
                        <span class="chat-title">${chat.title || 'Nuevo chat'}</span>
                    </div>
                    <div class="chat-summary">${chat.summary || 'Sin actividad'}</div>
                    <div class="chat-actions">
                        <button class="${chat.pinned ? 'pinned' : ''}" onclick="togglePin(event, '${chat.id}')" title="Fijar"><i class="fas fa-thumbtack"></i></button>
                        <button onclick="renameChat(event, '${chat.id}')" title="Renombrar"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteChat(event, '${chat.id}')" title="Borrar"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                div.onclick = () => { loadChat(chat.id); if(window.innerWidth <= 768) DOM.sidebar.classList.remove('mobile-open'); };
                DOM.savedChatsList.appendChild(div);
            });
        };

        DOM.searchChats.addEventListener('input', e => renderChatList(e.target.value));

        window.togglePin = (e, id) => {
            e.stopPropagation();
            chats[id].pinned = !chats[id].pinned;
            saveLocal(); renderChatList(DOM.searchChats.value);
        };

        window.renameChat = (e, id) => {
            e.stopPropagation();
            const newName = prompt("Nuevo nombre para el chat:", chats[id].title);
            if(newName && newName.trim()) {
                chats[id].title = newName.trim();
                saveLocal(); renderChatList(DOM.searchChats.value);
            }
        };

        window.deleteChat = (e, id) => {
            e.stopPropagation();
            if(confirm('¿Seguro que deseas eliminar este chat?')) {
                delete chats[id]; saveLocal();
                Object.keys(chats).length > 0 ? loadChat(Object.keys(chats)[0]) : createNewChat();
            }
        };

        const createNewChat = () => {
            const id = Date.now().toString();
            chats[id] = { id, title: "Nuevo chat", summary: "Inicia la conversación...", pinned: false, updated: Date.now(), history: [{ role: "system", content: generateSystemPrompt() }] };
            saveLocal(); loadChat(id);
        };

        const loadChat = (id) => {
            currentChatId = id; DOM.chatHistory.innerHTML = '';
            chats[id].history.forEach(msg => { if(msg.role !== 'system') renderMessage(msg.role, msg.content, msg.id); });
            renderChatList(DOM.searchChats.value); updateStats(); 
            setTimeout(() => DOM.chatHistory.scrollTop = DOM.chatHistory.scrollHeight, 100);
        };

        const renderMessage = (role, content, msgId = Date.now().toString()) => {
            const div = document.createElement('div');
            div.className = `message-container ${role}`;
            div.dataset.id = msgId;

            const avatar = role === 'user' ? '<i class="fas fa-user"></i>' : 'Z';
            const safeRaw = encodeURIComponent(content);
            
            let toolbar = role === 'user' 
                ? `<div class="msg-toolbar"><button onclick="editMsg('${msgId}')" title="Editar"><i class="fas fa-pen"></i></button></div>`
                : `<div class="msg-toolbar">
                    <button onclick="speakText(this, decodeURIComponent('${safeRaw}'))" title="Escuchar"><i class="fas fa-volume-up"></i></button>
                    <button onclick="copyMsg('${msgId}')" title="Copiar"><i class="fas fa-copy"></i></button>
                    <button onclick="regenerateLast()" title="Regenerar"><i class="fas fa-sync"></i></button>
                   </div>`;

            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-bubble" id="content-${msgId}">
                    ${role === 'user' ? content.replace(/\n/g, '<br>') : marked.parse(content)}
                </div>
                ${toolbar}
            `;
            DOM.chatHistory.appendChild(div);
            if(role === 'assistant') div.dataset.raw = content;
        };

        window.copyCodeSnippet = (id) => {
            const codeEl = document.getElementById(id);
            if(codeEl) {
                navigator.clipboard.writeText(codeEl.innerText);
                event.target.textContent = "¡Copiado!";
                setTimeout(() => event.target.textContent = "Copiar", 2000);
            }
        };

        window.copyMsg = (id) => {
            const el = document.querySelector(`[data-id="${id}"]`);
            if(el) { navigator.clipboard.writeText(el.dataset.raw); }
        };

        window.editMsg = (id) => {
            const chat = chats[currentChatId];
            const msgIndex = chat.history.findIndex(m => m.id === id);
            if(msgIndex === -1) return;
            const newText = prompt("Edita tu mensaje:", chat.history[msgIndex].content);
            if(newText && newText.trim()) {
                chat.history = chat.history.slice(0, msgIndex);
                DOM.userInput.value = newText;
                loadChat(currentChatId);
                handleSend();
            }
        };

        window.regenerateLast = () => {
            const chat = chats[currentChatId];
            if(chat.history.length > 2) {
                chat.history.pop(); saveLocal(); loadChat(currentChatId); requestAPI(chat.history);
            }
        };

        const handleSend = async () => {
            const text = DOM.userInput.value.trim();
            if (!text) return;

            DOM.userInput.value = ''; DOM.userInput.style.height = '22px'; DOM.sendBtn.disabled = true;
            
            const chat = chats[currentChatId];
            const msgId = Date.now().toString();
            chat.history.push({ role: "user", content: text, id: msgId });
            
            // Guardado inteligente y mini resumen automático basado en el inicio de la conversación
            if(chat.history.filter(m=>m.role==='user').length === 1) {
                chat.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
                chat.summary = `Tema inicial: "${text.substring(0, 40)}..."`;
            }
            chat.updated = Date.now();
            
            saveLocal(); renderChatList(DOM.searchChats.value); renderMessage('user', text, msgId); updateStats();
            DOM.chatHistory.scrollTop = DOM.chatHistory.scrollHeight;
            
            await requestAPI(chat.history);
        };

        const requestAPI = async (messages) => {
            DOM.typingIndicator.style.display = 'flex';
            DOM.stopBtnContainer.style.display = 'block';
            DOM.chatHistory.scrollTop = DOM.chatHistory.scrollHeight;

            abortController = new AbortController();
            const cleanMessages = messages.map(m => ({ role: m.role, content: m.content }));
            const selectedModel = DOM.modelSelect.value;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Zel AI Terminal'
                    },
                    body: JSON.stringify({ 
                        model: selectedModel, 
                        messages: cleanMessages, 
                        temperature: 0.7 
                    }),
                    signal: abortController.signal
                });

                const data = await response.json();
                
                if (!response.ok || data.error) {
                    throw new Error(data.error?.message || `Error del servidor: ${response.status}`);
                }

                const aiText = data.choices[0].message.content;
                chats[currentChatId].history.push({ role: "assistant", content: aiText, id: Date.now().toString() });
                chats[currentChatId].updated = Date.now();
                
                saveLocal(); renderMessage('assistant', aiText); updateStats();

            } catch (error) {
                if (error.name !== 'AbortError') {
                    renderMessage('assistant', `⚠️ **Error de Conexión:** ${error.message}`);
                }
            } finally {
                DOM.typingIndicator.style.display = 'none'; DOM.stopBtnContainer.style.display = 'none';
                DOM.userInput.focus(); DOM.chatHistory.scrollTop = DOM.chatHistory.scrollHeight;
            }
        };

        document.getElementById('summarizeBtn').addEventListener('click', async () => {
            if(!chats[currentChatId] || chats[currentChatId].history.length <= 2) {
                alert("No hay suficiente conversación para resumir.");
                return;
            }
            DOM.userInput.value = "Haz un resumen ejecutivo detallado de los puntos principales tratados en esta conversación.";
            await handleSend();
        });

        DOM.sendBtn.addEventListener('click', handleSend);
        document.getElementById('newChatBtn').addEventListener('click', createNewChat);
        DOM.stopBtn.addEventListener('click', () => { if(abortController) abortController.abort(); });
        
        document.getElementById('deleteBtn').addEventListener('click', () => {
            if(confirm('¿Eliminar este hilo completo?')) {
                delete chats[currentChatId]; saveLocal();
                Object.keys(chats).length > 0 ? loadChat(Object.keys(chats)[0]) : createNewChat();
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            let txt = `Zel AI Export - ${chats[currentChatId].title}\n\n`;
            chats[currentChatId].history.filter(m=>m.role!=='system').forEach(m => txt += `[${m.role.toUpperCase()}]: ${m.content}\n\n`);
            const blob = new Blob([txt], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Zel_Log_${Date.now()}.txt`; a.click();
        });

        loadPrefs();
        if (Object.keys(chats).length === 0) createNewChat();
        else loadChat(Object.keys(chats).sort((a,b) => chats[b].updated - chats[a].updated)[0]);

    </script>
</body>
</html>
